<!DOCTYPE html>

<html>
    <body>
        <main>
            <div class="manHinh">
                0
            </div>
            <button class="nutBam">Click me</button>



        </main> 

        <script>
            let dem = 0;

            const manHinh = document.querySelector(".manHinh")
            const button = document.querySelector(".nutBam") 
            
            console.log(manHinh, button)

            button.addEventListener("click", () => {
                dem += 1;
                manHinh.textContent = dem;
            });

        </script>
    </body>

</html>
