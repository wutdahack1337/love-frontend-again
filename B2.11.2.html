<!DOCTYPE html>

<html>
    <head> 
        <style>  
            .page {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 24px;
            } 

            .page header { 
                grid-column: 1 / -1;  
            } 
        </style> 
    </head> 

    <body class="page"> 
        <header>
            <h1>Chung ta khong thuoc ve nhau</h1> 
        </header>
        <aside>Day la sidebar ne</aside>
        <main>
            <div>Seven</div>
            <div>Eight</div>
            <div>Night</div>
            <div>Ten</div>
        </main>
        
    </body>
</html>
