<!DOCTYPE html>

<html>
    <head> 
        <style>  
            .gallery {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
            }
            .page {
                display: grid;
                grid-template-columns: 250px 1fr;
                gap: 24px;
            }
        </style> 
    </head> 

    <body> 
        <div class="gallery">
            <div>One</div>
            <div>Two</div>
            <div>Three</div>
            <div>Four</div>
            <div>Five</div>
            <div>Six</div>
        </div>       
    </body>
</html>
